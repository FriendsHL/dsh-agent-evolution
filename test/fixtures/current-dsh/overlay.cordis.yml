- id: agent-default-model
  config:
    provider: agent-evolution-mock
    model: agent-evolution-mock

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: headless-runner
  disabled: true

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: minimal
        roots:
          - path: !!js process.env.DSH_CHECKOUT + '/apps/cli/config/agent-presets'
            trust: system
        includeUserRoot: false

    - id: agent-evolution-integration-mock-llm
      name: './mock-llm.mjs'

    - id: agent-evolution-preset-headless-runner
      name: './preset-headless-runner.mjs'
      inject: [headlessStartup]
